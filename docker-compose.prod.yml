services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artenova}
      POSTGRES_USER: ${POSTGRES_USER:-artenova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artenova} -d ${POSTGRES_DB:-artenova}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: prod
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-artenova}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artenova}?schema=public
      APP_BASE_URL: ${PROD_APP_BASE_URL:-http://localhost:90}
      API_BASE_URL: ${PROD_API_BASE_URL:-http://localhost:90/api}
      NODE_ENV: production
      UPLOAD_DRIVER: s3
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: prod
    ports:
      - "90:80"
    depends_on:
      - api

volumes:
  postgres_prod_data:
    name: artenova_web_postgres_dev_data

