services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artenova}
      POSTGRES_USER: ${POSTGRES_USER:-artenova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artenova_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artenova} -d ${POSTGRES_DB:-artenova}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    env_file:
      - .env
    environment:
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      DATABASE_URL: postgresql://${POSTGRES_USER:-artenova}:${POSTGRES_PASSWORD:-artenova_dev}@postgres:5432/${POSTGRES_DB:-artenova}?schema=public
      APP_BASE_URL: http://localhost:5174
      API_BASE_URL: http://localhost:4000
      UPLOAD_DRIVER: s3
    command: >
      sh -c "pnpm --filter @artenova/api db:generate &&
      pnpm --filter @artenova/api db:deploy &&
      pnpm --filter @artenova/api db:seed &&
      pnpm --filter @artenova/api dev"
    ports:
      - "4000:4000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/package.json:/app/apps/api/package.json
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      CI: "true"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      VITE_USE_POLLING: "true"
      VITE_DEV_API_PROXY_TARGET: http://api:4000
    ports:
      - "5174:5174"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/package.json:/app/apps/web/package.json
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./packages/shared/src:/app/packages/shared/src
      - ./packages/shared/package.json:/app/packages/shared/package.json
    depends_on:
      - api

volumes:
  postgres_dev_data:
